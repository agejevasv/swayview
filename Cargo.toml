[package]
name = "swayview"
version = "0.1.6"
description = "Live workspace overview for sway"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
cosmic-text = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
smithay-client-toolkit.workspace = true
tiny-skia = "0.12.0"
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints]
workspace = true

[workspace]
members = ["tools/fake-window"]

[workspace.package]
license = "MIT"
repository = "https://github.com/agejevasv/swayview"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
smithay-client-toolkit = "0.21.1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pixel math converts between i32/u32/f32 constantly; these are noise here.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Colors read best as 0xRRGGBBAA, and x/y/w/h is the idiom for geometry.
unreadable_literal = "allow"
many_single_char_names = "allow"
